services:
  devops-be:
    build: ./tp-devops-be
    ports:
      - "8080:8080"
    hostname: "devops_be"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DB_HOST=devops_db
      - DB_PORT=5432
      - DB_USER=devuser
      - DB_PASS=devpass
      - DB_NAME=devops
      - REDIS_HOST=devops_redis
      - REDIS_PORT=6379
    depends_on:
      devops_db:
        condition: service_healthy
  devops_fe:
    build: 
      context: ./tp-devops-fe
      args:
        - NEXT_PUBLIC_BE_SCHEMA=http
        - NEXT_PUBLIC_BE_HOST=localhost
        - NEXT_PUBLIC_BE_PORT=8080
    ports:
      - "80:80"
    volumes:
      - ./tp-devops-fe/src:/app/src
      - ./tp-devops-fe/public:/app/public
      - ./tp-devops-fe/package.json:/app/package.json
      - ./tp-devops-fe/tsconfig.json:/app/tsconfig.json
    depends_on:
      - devops-be
    environment:
      - NODE_ENV=development
      - PORT=80
  devops_db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=devops
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpass
    ports:
      - "5432:5432"
    volumes:
      - devops_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devops"]
      interval: 5s
      timeout: 5s
      retries: 10
  devops_redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  devops_db_data:
