# Complete deployment manifest for the DevOps project
# This file combines all components: Database, Redis, Backend, Frontend, Prometheus, Grafana, and Nginx Load Balancer

# PostgreSQL Database
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devops-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-db
  template:
    metadata:
      labels:
        app: devops-db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: devops
        - name: POSTGRES_USER
          value: devuser
        - name: POSTGRES_PASSWORD
          value: devpass
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:latest
        ports:
        - containerPort: 9187
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://devuser:devpass@localhost:5432/devops?sslmode=disable"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: devops-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: devops-db
spec:
  selector:
    app: devops-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  - name: metrics
    port: 9187
    targetPort: 9187

# Redis Cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-redis
  template:
    metadata:
      labels:
        app: devops-redis
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - containerPort: 6379
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        ports:
        - containerPort: 9121
        env:
        - name: REDIS_ADDR
          value: "localhost:6379"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-redis
spec:
  selector:
    app: devops-redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: metrics
    port: 9121
    targetPort: 9121

# Backend Application
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-be
  template:
    metadata:
      labels:
        app: devops-be
    spec:
      containers:
      - name: devops-be
        image: ramirezcgn/tp-devops-be:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        env:
        - name: NODE_ENV
          value: development
        - name: PORT
          value: "8080"
        - name: DB_HOST
          value: devops-db
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: devuser
        - name: DB_PASS
          value: devpass
        - name: DB_NAME
          value: devops
        - name: REDIS_HOST
          value: devops-redis
        - name: REDIS_PORT
          value: "6379"
        - name: JAEGER_OTLP_ENDPOINT
          value: "http://jaeger-collector:4318/v1/traces"
        - name: LOG_LEVEL
          value: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-be
spec:
  selector:
    app: devops-be
  ports:
  - port: 8080
    targetPort: 8080

# Frontend Application (3 replicas for load balancing)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-fe
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-fe
  template:
    metadata:
      labels:
        app: devops-fe
    spec:
      containers:
      - name: devops-fe
        image: ramirezcgn/tp-devops-fe:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: development
        - name: PORT
          value: "3000"
        - name: NEXT_PUBLIC_BE_SCHEMA
          value: http
        - name: NEXT_PUBLIC_BE_HOST
          value: devops-be
        - name: NEXT_PUBLIC_BE_PORT
          value: "8080"
        - name: JAEGER_OTLP_ENDPOINT
          value: "http://jaeger-collector:4318/v1/traces"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-fe
spec:
  selector:
    app: devops-fe
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP

# Prometheus Monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'devops-be'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: devops-be
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:8080
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      - job_name: 'devops-fe'
        metrics_path: '/api/metrics'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: devops-fe
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:3000
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      
      - job_name: 'postgres'
        static_configs:
          - targets: ['devops-db:9187']
      
      - job_name: 'redis'
        static_configs:
          - targets: ['devops-redis:9121']
      
      - job_name: 'nginx'
        static_configs:
          - targets: ['nginx-lb:9113']
      
      - job_name: 'cadvisor'
        static_configs:
          - targets: ['cadvisor:8080']
      
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: LoadBalancer

# Grafana Dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'DevOps Dashboards'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /etc/grafana/dashboards
  devops-dashboard.json: |
    {
      "title": "DevOps Application Metrics",
      "tags": ["devops", "monitoring"],
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 0,
      "refresh": "10s",
      "panels": [
          {
            "id": 1,
            "title": "Container CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(process_cpu_seconds_total{job=~\"devops-be|devops-fe|postgres|redis\"}[5m]) * 100",
                "legendFormat": "{{instance}}"
              }
            ],
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "yaxes": [{"label": "CPU %", "format": "percent"}]
          },
          {
            "id": 2,
            "title": "Container Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "process_resident_memory_bytes{job=~\"devops-be|devops-fe|postgres|redis\"} / 1024 / 1024",
                "legendFormat": "{{instance}}"
              }
            ],
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "yaxes": [{"label": "Memory (MB)", "format": "short"}]
          },
          {
            "id": 3,
            "title": "Total Todos",
            "type": "stat",
            "targets": [
              {
                "expr": "todos_total"
              }
            ],
            "gridPos": {"x": 0, "y": 8, "w": 6, "h": 4}
          },
          {
            "id": 4,
            "title": "Active Todos",
            "type": "stat",
            "targets": [
              {
                "expr": "todos_active"
              }
            ],
            "gridPos": {"x": 6, "y": 8, "w": 6, "h": 4}
          },
          {
            "id": 5,
            "title": "Completed Todos",
            "type": "stat",
            "targets": [
              {
                "expr": "todos_completed"
              }
            ],
            "gridPos": {"x": 12, "y": 8, "w": 6, "h": 4}
          },
          {
            "id": 6,
            "title": "HTTP Requests Total",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total[5m]))"
              }
            ],
            "gridPos": {"x": 18, "y": 8, "w": 6, "h": 4}
          },
          {
            "id": 7,
            "title": "HTTP Request Duration (P95)",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "p95"
              },
              {
                "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "p50"
              }
            ],
            "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
            "yaxes": [{"label": "Duration (s)", "format": "s"}]
          },
          {
            "id": 8,
            "title": "Cache Hit Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) * 100",
                "legendFormat": "Hit Rate %"
              }
            ],
            "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
            "yaxes": [{"label": "Hit Rate %", "format": "percent", "max": 100}]
          },
          {
            "id": 9,
            "title": "Cache Hits vs Misses",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(cache_hits_total[5m])",
                "legendFormat": "Hits"
              },
              {
                "expr": "rate(cache_misses_total[5m])",
                "legendFormat": "Misses"
              }
            ],
            "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8}
          },
          {
            "id": 10,
            "title": "Stress Tests Executed",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(stress_tests_total)"
              }
            ],
            "gridPos": {"x": 12, "y": 20, "w": 6, "h": 4}
          },
          {
            "id": 11,
            "title": "Node.js Heap Memory",
            "type": "graph",
            "targets": [
              {
                "expr": "nodejs_heap_used_bytes / 1024 / 1024",
                "legendFormat": "Heap Used (MB)"
              },
              {
                "expr": "nodejs_heap_total_bytes / 1024 / 1024",
                "legendFormat": "Heap Total (MB)"
              }
            ],
            "gridPos": {"x": 0, "y": 28, "w": 12, "h": 8},
            "yaxes": [{"label": "Memory (MB)", "format": "short"}]
          },
          {
            "id": 12,
            "title": "HTTP Requests by Status",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{status_code=~\"2..\"}[5m])",
                "legendFormat": "2xx"
              },
              {
                "expr": "rate(http_requests_total{status_code=~\"4..\"}[5m])",
                "legendFormat": "4xx"
              },
              {
                "expr": "rate(http_requests_total{status_code=~\"5..\"}[5m])",
                "legendFormat": "5xx"
              }
            ],
            "gridPos": {"x": 12, "y": 28, "w": 12, "h": 8}
          }
        ],
        "time": {"from": "now-15m", "to": "now"}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: JAEGER_AGENT_HOST
          value: jaeger-agent
        - name: JAEGER_AGENT_PORT
          value: "6831"
        - name: JAEGER_SAMPLER_TYPE
          value: const
        - name: JAEGER_SAMPLER_PARAM
          value: "1"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards-content
          mountPath: /etc/grafana/dashboards
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards
          items:
          - key: dashboards.yaml
            path: dashboards.yaml
      - name: grafana-dashboards-content
        configMap:
          name: grafana-dashboards
          items:
          - key: devops-dashboard.json
            path: devops-dashboard.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
  - port: 8080
    targetPort: 3000
  type: LoadBalancer

# Nginx Load Balancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        upstream frontend {
            least_conn;
            server devops-fe:3000;
        }

        upstream backend {
            least_conn;
            server devops-be:8080;
        }

        server {
            listen 80;
            server_name _;

            # NGINX status endpoint for prometheus exporter
            location /nginx_status {
                stub_status on;
                access_log off;
                allow 127.0.0.1;
                deny all;
            }

            location / {
                proxy_pass http://frontend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 60s;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
            }

            location /api {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Proxy para trazas de OpenTelemetry hacia Jaeger
            location /v1/traces {
                proxy_pass http://jaeger-collector:4318/v1/traces;
                proxy_set_header Content-Type application/json;
                proxy_read_timeout 10s;
                proxy_connect_timeout 10s;
                proxy_send_timeout 10s;
            }

            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-lb
  template:
    metadata:
      labels:
        app: nginx-lb
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf

      # NGINX Prometheus Exporter Sidecar
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        ports:
        - containerPort: 9113
        args:
          - -nginx.scrape-uri=http://localhost/nginx_status

      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
spec:
  selector:
    app: nginx-lb
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: nginx-exporter
    port: 9113
    targetPort: 9113
  type: LoadBalancer

# Jaeger Tracing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        ports:
        - containerPort: 5775
          protocol: UDP
          name: zipkin-compact
        - containerPort: 6831
          protocol: UDP
          name: jaeger-compact
        - containerPort: 6832
          protocol: UDP
          name: jaeger-binary
        - containerPort: 5778
          name: configs
        - containerPort: 16686
          name: query-http
        - containerPort: 14268
          name: collector-http
        - containerPort: 4318
          name: otlp-http
        - containerPort: 14250
          name: collector-grpc
        - containerPort: 9411
          name: zipkin
        env:
        - name: COLLECTOR_ZIPKIN_HOST_PORT
          value: ":9411"
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  labels:
    app: jaeger
spec:
  type: LoadBalancer
  selector:
    app: jaeger
  ports:
  - name: query-http
    port: 16686
    targetPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: collector-http
    port: 14268
    targetPort: 14268
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: collector-grpc
    port: 14250
    targetPort: 14250
  - name: zipkin
    port: 9411
    targetPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: jaeger-compact
    port: 6831
    targetPort: 6831
    protocol: UDP
  - name: jaeger-binary
    port: 6832
    targetPort: 6832
    protocol: UDP
  - name: zipkin-compact
    port: 5775
    targetPort: 5775
    protocol: UDP
  - name: configs
    port: 5778
    targetPort: 5778
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  labels:
    app: cadvisor
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      containers:
      - name: cadvisor
        image: gcr.io/cadvisor/cadvisor:v0.47.0
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - name: rootfs
          mountPath: /rootfs
          readOnly: true
        - name: var-run
          mountPath: /var/run
          readOnly: false
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: docker
          mountPath: /var/lib/docker
          readOnly: true
        - name: disk
          mountPath: /dev/disk
          readOnly: true
        resources:
          requests:
            memory: 200Mi
            cpu: 200m
          limits:
            memory: 400Mi
            cpu: 400m
      volumes:
      - name: rootfs
        hostPath:
          path: /
      - name: var-run
        hostPath:
          path: /var/run
      - name: sys
        hostPath:
          path: /sys
      - name: docker
        hostPath:
          path: /var/lib/docker
      - name: disk
        hostPath:
          path: /dev/disk
