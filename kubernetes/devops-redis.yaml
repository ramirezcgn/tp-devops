apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-redis
  template:
    metadata:
      labels:
        app: devops-redis
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - containerPort: 6379
      
      # Redis Exporter Sidecar
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        ports:
        - containerPort: 9121
        env:
        - name: REDIS_ADDR
          value: "localhost:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-redis
spec:
  selector:
    app: devops-redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  - name: redis-exporter
    port: 9121
    targetPort: 9121
