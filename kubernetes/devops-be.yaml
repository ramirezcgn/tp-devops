apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-be
  template:
    metadata:
      labels:
        app: devops-be
    spec:
      containers:
      - name: devops-be
        image: ramirezcgn/tp-devops-be:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        env:
        - name: NODE_ENV
          value: development
        - name: PORT
          value: "8080"
        - name: DB_HOST
          value: devops-db
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: devuser
        - name: DB_PASS
          value: devpass
        - name: DB_NAME
          value: devops
        - name: REDIS_HOST
          value: devops-redis
        - name: REDIS_PORT
          value: "6379"
        - name: JAEGER_OTLP_ENDPOINT
          value: "http://jaeger-collector:4318/v1/traces"
        - name: LOG_LEVEL
          value: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: devops-be
spec:
  selector:
    app: devops-be
  ports:
  - port: 8080
    targetPort: 8080
