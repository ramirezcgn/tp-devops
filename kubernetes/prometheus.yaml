apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'devops-be'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['devops-be:8080']

      - job_name: 'devops-fe'
        metrics_path: '/api/metrics'
        static_configs:
          - targets: ['devops-fe:3000']

      - job_name: 'cadvisor'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['cadvisor:8080']

      - job_name: 'postgres'
        static_configs:
          - targets: ['devops-db:9187']

      - job_name: 'redis'
        static_configs:
          - targets: ['devops-redis:9121']

      - job_name: 'nginx'
        static_configs:
          - targets: ['nginx-lb:9113']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP
