apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devops-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-db
  template:
    metadata:
      labels:
        app: devops-db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: devops
        - name: POSTGRES_USER
          value: devuser
        - name: POSTGRES_PASSWORD
          value: devpass
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      
      # Postgres Exporter Sidecar
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:latest
        ports:
        - containerPort: 9187
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://devuser:devpass@localhost:5432/devops?sslmode=disable"
      
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: devops-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: devops-db
spec:
  selector:
    app: devops-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  - name: postgres-exporter
    port: 9187
    targetPort: 9187
